<body>
    <div class="container py-5">
        <div class="text-center mb-4">
            <h2>Rider Tracking System</h2>
            <p class="text-muted">Select a table format to view rider data</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="formatForm" action="/view-table" method="get">
                    <input type="hidden" id="formatInput" name="format" value="1">

                    <div class="row g-3 mb-4">
                        <!-- Format 1 -->
                        <div class="col-md-4">
                            <div class="format-option active" data-format="1">
                                <div class="format-header">Standard Table</div>
                                <div class="format-preview">
                                    <div class="table-sample table1-preview"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Format 2 -->
                        <div class="col-md-4">
                            <div class="format-option" data-format="2">
                                <div class="format-header">Blue Theme</div>
                                <div class="format-preview">
                                    <div class="table-sample table2-preview"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Format 3 -->
                        <div class="col-md-4">
                            <div class="format-option" data-format="3">
                                <div class="format-header">Dark Theme</div>
                                <div class="format-preview">
                                    <div class="table-sample table3-preview"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">
                            View Table
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const formatOptions = document.querySelectorAll('.format-option');
            const formatInput = document.getElementById('formatInput');

            // Handle format selection
            formatOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove active class from all options
                    formatOptions.forEach(opt => opt.classList.remove('active'));

                    // Add active class to selected option
                    this.classList.add('active');

                    // Update hidden input value
                    formatInput.value = this.dataset.format;
                });
            });

            // Enable direct submission when clicking on a format
            formatOptions.forEach(option => {
                option.addEventListener('dblclick', function() {
                    formatInput.value = this.dataset.format;
                    document.getElementById('formatForm').submit();
                });
            });
        });
    </script>
</body>
